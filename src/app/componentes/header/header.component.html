<header class="roboto w-full">
  <nav class="bg-white border-gray-200 px-4 lg:px-6 py-3 dark:bg-gray-800 shadow-sm w-full">
    <div class="flex flex-wrap items-center justify-between gap-3 w-full">
      <a class="flex items-center gap-2">
        <i class="fa-solid fa-code text-2xl text-blue-600"></i>
        <span class="text-xl font-semibold dark:text-white">Code Snippet</span>
      </a>

      <button (click)="abrirModal()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i>
        <span>Novo Snippet</span>
      </button>
    </div>

    <div class="flex items-center gap-3 mt-3 w-full">
        <!-- Barra de pesquisa -->
        <div class="relative flex-grow">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input
            type="text"
            placeholder="Buscar snippet por título, descrição ou tags..."
            class="w-full pl-10 pr-4 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 h-11"
            />
        </div>

        <!-- Filtro -->
        <div class="relative w-40 md:w-48">
        <select class="w-full border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm h-11 appearance-none pl-9 pr-3">
            <option value="">Todos</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="csharp">C#</option>
            <option value="typescript">TypeScript</option>
        </select>

            <span class="absolute inset-y-0 left-2 flex items-center text-gray-500 pointer-events-none">
                <i class="fa-solid fa-filter"></i>
            </span>

            <span class="absolute inset-y-0 right-2 flex items-center text-gray-500 pointer-events-none">
                <i class="fa-solid fa-caret-down"></i>
            </span>
        </div>

    </div>
  </nav>
</header>

<app-snippet-form
  [isOpen]="isModalOpen"
  (close)="fecharModal()"
></app-snippet-form>
